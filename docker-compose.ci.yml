
services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./letter_of_credit:/mnt/extra-addons/letter_of_credit

    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
